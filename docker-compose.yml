name: barq-assessment
x-app: &app
  build: .
  init: true
  restart: unless-stopped
  cpus: "0.50"
  mem_limit: "256m"
  mem_reservation: "128m"
  env_file: ./config/app.env

  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
    interval: 5s
    timeout: 3s
    retries: 3
    start_period: 3s
  networks: [frontend, backend]
services:
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    container_name: postgres
    restart: unless-stopped
    cpus: "1.00"
    mem_limit: "512m"
    mem_reservation: "256m"
    env_file:
      - ./config/app.env

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barq_app -d barq_tasks"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks: [backend]
  redis:
    image: redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    container_name: redis
    restart: unless-stopped
    cpus: "0.50"
    mem_limit: "128m"
    mem_reservation: "64m"
    command: ["redis-server", "--save", "", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 5
    networks: [backend]
  app-01:
    <<: *app
    container_name: app-01
    environment:
      INSTANCE_ID: "app-01"
  app-02:
    <<: *app
    container_name: app-02
    environment:
      INSTANCE_ID: "app-02"
  app-03:
      <<: *app
      container_name: app-03
      environment:
        INSTANCE_ID: "app-03"
  nginx:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    container_name: nginx
    restart: unless-stopped
    cpus: "0.50"
    mem_limit: "64m"
    mem_reservation: "32m"
    ports: ["127.0.0.1:${PUBLIC_PORT:-8080}:80"]
    volumes: ["./nginx/nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [app-01, app-02, app-03]
    networks: [frontend]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/nginx-health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
networks:
  frontend:
  backend:
    internal: true
volumes:
  postgres-data:
